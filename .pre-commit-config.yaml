exclude: "^tests/fixtures/"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: forbid-secrets-and-agent-files
        name: forbid .env, vendor binaries and agent files
        entry: "Forbidden file staged (secrets, vendor binary or local agent file)"
        language: fail
        files: '^(\.env$|\.env\..*(?<!example)$|vendor/|CLAUDE\.md$|\.claude/|\.dev/)'
