default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: "^tests/fixtures/"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: forbid-secrets-and-agent-files
        name: forbid .env, vendor binaries and agent files
        entry: "Forbidden file staged (secrets, vendor binary or local agent file)"
        language: fail
        files: '^(\.env$|\.env\..*(?<!example)$|vendor/|CLAUDE\.md$|\.claude/|\.dev/)'
      # Before every push: the full test suite and type check, so a red main never leaves the
      # machine. Uses the project venv directly (uv may not be on the PATH that git hooks see).
      - id: pytest
        name: pytest (pre-push)
        entry: ./.venv/Scripts/python.exe -m pytest -q -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pyright
        name: pyright (pre-push)
        entry: ./.venv/Scripts/python.exe -m pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
