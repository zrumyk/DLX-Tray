[project]
name = "dlx-tray"
version = "2.0.0"
description = "Free desktop translator for Windows powered by a bundled DLX (DeepLX) server, with chunking for large texts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "zrumyk" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pyside6-essentials>=6.8",
    "httpx>=0.28",
    "deepl>=1.33.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "charset-normalizer>=3.4",
    "pydantic-settings>=2.6",
    "keyring>=25.5",
]

[project.scripts]
dlx-tray = "dlx_tray.__main__:main"

[dependency-groups]
dev = [
    { include-group = "cloud" },
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "respx>=0.22",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "hypothesis>=6.170.15",
    "pytest-cov>=7.1.0",
]
build = [
    "pyinstaller>=6.11",
]
cloud = [
    "fastapi>=0.165.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=3.2.0",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlx_tray"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "cloud", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "N",             # naming
    "RUF",           # ruff-specific
    "PTH",           # use pathlib
    "T20",           # no print
    "LOG", "G",      # logging hygiene
]
ignore = [
    "N802",          # Qt overrides use camelCase (e.g. closeEvent)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]
"cloud/dlx_cloud/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "cloud", "tests", "scripts"]
extraPaths = ["cloud"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cloud"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: hits the real DLX/DeepL network (run with -m live)",
]
qt_api = "pyside6"

# ---------------------------------------------------------------- coverage
# The gate covers the Qt-free layers only; ui/ and app.py are exercised by pytest-qt smoke
# tests and manual checks (.dev/docs/TEST_CHECKLIST.md), not by a percentage.
[tool.coverage.run]
source = ["dlx_tray", "dlx_cloud"]
branch = true

[tool.coverage.report]
include = [
    "*/dlx_tray/contracts/*",
    "*/dlx_tray/core/*",
    "*/dlx_tray/providers/*",
    "*/dlx_tray/services/*",
    "*/dlx_tray/fileio/*",
    "*/dlx_cloud/*",
]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
