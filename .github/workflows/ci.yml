name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      # The combined 85% branch coverage gate is configured in pyproject.toml.
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

      - name: Cloud branch coverage
        run: uv run pytest tests/cloud --cov=dlx_cloud --cov-fail-under=85

      # Timing tests are skipped under coverage tracing; run them on their own.
      - name: Performance tests
        run: uv run pytest -k performance

  licenses:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check runtime dependency licenses
        run: uv run --locked --isolated --no-dev --with pip-licenses python scripts/check_licenses.py

  cloud-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Cloud Run image
        run: docker build -f cloud/Dockerfile -t dlx-cloud:ci .
      - name: Check server dependency isolation
        run: >-
          docker run --rm --entrypoint .venv/bin/python dlx-cloud:ci
          -c "from importlib.util import find_spec;
          assert not any(map(find_spec, ('PySide6', 'docx', 'pdfplumber', 'dlx_tray.ui')));
          import dlx_cloud.app"
