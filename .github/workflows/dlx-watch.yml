name: DLX release watch

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      pinned_version:
        description: 'Override the pinned version for this run (e.g. v0.0.0 to test issue creation)'
        type: string
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: dlx-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the latest DLX release
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_VERSION: ${{ inputs.pinned_version }}
        run: python3 scripts/watch_deeplx.py --repo "$GITHUB_REPOSITORY" --pinned-version "$PINNED_VERSION"
